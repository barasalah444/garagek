{% extends 'base.html' %}
{% load static %}
{% block title %}Garagak - Garages{% endblock %}
{% block content %}
<section class="section dx-page">
  <div class="container" style="max-width:1100px">
    <h1 class="dx-title" data-i18n="g_title">كراجات رام الله</h1>
    <p class="dx-sub mb-4" data-i18n="g_sub"></p>

    <div class="g-filters mb-3" id="gFilters">
      <button type="button" class="g-filter active" data-origin="" data-i18n="g_all">الكل</button>
      {% for key, label in origins %}
      <button type="button" class="g-filter" data-origin="{{ key }}" data-i18n="origin_{{ key }}">{{ label }}</button>
      {% endfor %}
    </div>

    <p class="g-note small mb-3" id="gNote"></p>

    <div id="gLoading" class="text-center my-4 d-none">
      <div class="spinner-border text-warning" role="status"></div>
      <p class="mt-2 mb-0" data-i18n="g_loading">جاري تحميل الكراجات...</p>
    </div>

    <div id="gList" class="row g-3" data-api="{% url 'garages_api' %}"></div>

    <p id="gEmpty" class="text-center my-5 d-none" data-i18n="g_none">ما لقينا كراجات حالياً</p>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/garages.js' %}"></script>
{% endblock %}
