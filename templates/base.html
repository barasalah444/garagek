{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Garagak{% endblock %}</title>
  <link id="bsCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Oswald:wght@500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>

  <div class="topbar d-none d-md-block">
    <div class="container d-flex justify-content-between flex-wrap gap-2 py-2">
      <div class="d-flex flex-wrap gap-3">
        <span><i class="bi bi-geo-alt-fill"></i><span data-i18n="topbar_loc"></span></span>
        <span><i class="bi bi-telephone-fill"></i><span data-i18n="topbar_support"></span> <a href="tel:0599999999" dir="ltr">0599999999</a></span>
        <span><i class="bi bi-envelope-fill"></i><a href="mailto:garageh@gmail.com" dir="ltr">garageh@gmail.com</a></span>
      </div>
      <span><i class="bi bi-clock-fill"></i><span data-i18n="topbar_time"></span> <small class="topbar-days" data-i18n="topbar_days"></small></span>
    </div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark main-nav">
    <div class="container">
      <a class="navbar-brand brand" href="{% url 'home' %}"><i class="bi bi-car-front-fill"></i> <span data-i18n="brand"></span></a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav mx-auto text-uppercase">
          <li class="nav-item"><a class="nav-link" href="{% url 'home' %}" data-i18n="nav_home"></a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'diagnose' %}" data-i18n="nav_diagnose"></a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'garages' %}" data-i18n="nav_garages"></a></li>
          {% if user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{% url 'history' %}" data-i18n="nav_history"></a></li>
          {% endif %}
          <li class="nav-item"><a class="nav-link" href="{% url 'about' %}" data-i18n="nav_about"></a></li>
        </ul>

        <button type="button" id="langBtn" class="btn btn-outline-light btn-sm rounded-0 me-2"></button>

        {% if user.is_authenticated %}
          <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2 mb-0">
            {% csrf_token %}
            <span class="text-white small"><span data-i18n="hi"></span> {{ user.username }}</span>
            <button class="btn btn-garagak btn-sm" data-i18n="logout"></button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2 rounded-0" data-i18n="login"></a>
          <a href="{% url 'register' %}" class="btn btn-garagak btn-sm" data-i18n="register"></a>
        {% endif %}
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="footer text-center py-4">
    <div class="container" data-i18n="footer"></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
