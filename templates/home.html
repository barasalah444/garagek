{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="hero">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-7">
        <p class="eyebrow" data-i18n="hero_eyebrow"></p>
        <h1 data-i18n="hero_title"></h1>
        <p class="col-lg-9 mt-3" data-i18n="hero_text"></p>
        <a href="{% url 'diagnose' %}" class="btn btn-garagak mt-3" data-i18n="btn_diagnose_now"></a>
        <a href="{% url 'garages' %}" class="btn btn-outline-light rounded-0 mt-3 ms-2" data-i18n="btn_browse"></a>
      </div>
    </div>
  </div>
</section>

<section class="features">
  <div class="container">
    <div class="row g-3 justify-content-center">
      <div class="col-md-4 col-lg-3"><div class="feature-card"><h5 data-i18n="f1_t"></h5><p class="mb-0" data-i18n="f1_d"></p></div></div>
      <div class="col-md-4 col-lg-3"><div class="feature-card active"><h5 data-i18n="f2_t"></h5><p class="mb-0" data-i18n="f2_d"></p></div></div>
      <div class="col-md-4 col-lg-3"><div class="feature-card"><h5 data-i18n="f3_t"></h5><p class="mb-0" data-i18n="f3_d"></p></div></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <p class="eyebrow" data-i18n="how_eyebrow"></p>
    <h2 class="mb-5" data-i18n="how_title"></h2>
    <div class="row g-4">
      <div class="col-md-4"><div class="step"><i class="bi bi-camera-fill"></i><h5 data-i18n="s1_t"></h5><p data-i18n="s1_d"></p></div></div>
      <div class="col-md-4"><div class="step"><i class="bi bi-cpu-fill"></i><h5 data-i18n="s2_t"></h5><p data-i18n="s2_d"></p></div></div>
      <div class="col-md-4"><div class="step"><i class="bi bi-geo-alt-fill"></i><h5 data-i18n="s3_t"></h5><p data-i18n="s3_d"></p></div></div>
    </div>
  </div>
</section>

<section class="section section-alt">
  <div class="container">
    <p class="eyebrow" data-i18n="cat_eyebrow"></p>
    <h2 class="mb-5" data-i18n="cat_title"></h2>
    <div class="row g-4">
      {% for slug, name in origins %}
      <div class="col-md-6 col-lg-4">
        <a href="{% url 'garages' %}?origin={{ slug }}" class="text-decoration-none">
          <div class="cat-card">
            <span class="icon-badge"><i class="bi bi-wrench-adjustable"></i></span>
            <div class="cat-visual">
              <span class="fi cat-flag fi-{% if slug == 'german' %}de{% elif slug == 'japanese' %}jp{% elif slug == 'korean' %}kr{% elif slug == 'american' %}us{% elif slug == 'chinese' %}cn{% elif slug == 'french' %}fr{% endif %}"></span>
            </div>
            <div class="body">
              <h5 data-i18n="cars_{{ slug }}"></h5>
              <p data-i18n="desc_{{ slug }}"></p>
              <span class="more"><span data-i18n="view_garages"></span> <i class="bi bi-arrow-right"></i></span>
            </div>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
